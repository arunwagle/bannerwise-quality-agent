bundle:
  name: bannerwise_quality_agent

resources:
  apps:
    bannerwise_quality_agent:
      name: '${workspace.current_user.domain_friendly_name}-bannerwise-quality-agent'
      source_code_path: ./apps
      description: 'Bannerwise Quality Agent — AI-powered banner quality assessment app'

      user_api_scopes:
        - 'files'

      permissions:
        - level: CAN_USE
          group_name: users

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-aw-serverless-stable.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://fevm-aw-serverless-stable.cloud.databricks.com
      root_path: /Workspace/Users/arun.wagle@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: arun.wagle@databricks.com
        level: CAN_MANAGE
