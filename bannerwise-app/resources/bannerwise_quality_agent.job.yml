resources:
  jobs:
    # ─────────────────────────────────────────────────────────────
    # Setup Job — Creates data model and populates synthetic data
    # ─────────────────────────────────────────────────────────────
    setup_job:
      name: 'bannerwise-quality-agent-setup'
      description: 'Creates data model tables and populates with synthetic data'
      tags:
        project: bannerwise-quality-agent
        purpose: setup

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}

      tasks:
        - task_key: reset_vector_index
          description: 'Ensures VS index is reset for clean recreation by vector_index_job'
          notebook_task:
            notebook_path: ../notebooks/vs/cleanup_vector_index.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'

        - task_key: create_system_tables
          description: 'Initializes system tables (corpus with CDF, draft, history, review queue)'
          notebook_task:
            notebook_path: ../notebooks/data/create_tables.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'

        - task_key: seed_corpus
          description: 'Seeds certified QA corpus with 20 approved entries (embedding_text auto-generated)'
          depends_on:
            - task_key: create_system_tables
          notebook_task:
            notebook_path: ../tests/notebooks/setup_test_data.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'

        - task_key: create_app_tables
          description: 'Creates and populates 9 analytics tables (ad_metrics, campaign_metrics, etc.)'
          depends_on:
            - task_key: create_system_tables
          notebook_task:
            notebook_path: ../notebooks/data/create_synthetic_data.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'

      queue:
        enabled: true

    # ─────────────────────────────────────────────────────────────
    # Setup Access Job — Configures app SP connectivity
    # ─────────────────────────────────────────────────────────────
    setup_access_job:
      name: 'bannerwise-quality-agent-access'
      description: 'Configures app service principal connectivity to workspace resources'
      tags:
        project: bannerwise-quality-agent
        purpose: access-setup

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: app_sp_id
          default: ${resources.apps.bannerwise_quality_agent.service_principal_id}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: serving_endpoint_name
          default: ${var.serving_endpoint_name}
        - name: vs_endpoint_name
          default: ${resources.vector_search_endpoints.bannerwise_vs_endpoint.id}
        - name: llm_endpoint_name
          default: ${var.judge_model}
        - name: genie_space_id
          default: ${resources.genie_spaces.bannerwise_analytics.id}

      tasks:
        - task_key: configure_uc_access
          description: 'Setup app connectivity to Unity Catalog resources'
          notebook_task:
            notebook_path: ../notebooks/access/setup_uc_access.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              app_sp_id: '{{job.parameters.app_sp_id}}'
              sql_warehouse_id: '{{job.parameters.sql_warehouse_id}}'

        - task_key: configure_vs_access
          description: 'Setup app + model serving connectivity to Vector Search endpoint and index'
          notebook_task:
            notebook_path: ../notebooks/access/setup_vs_access.py
            base_parameters:
              app_sp_id: '{{job.parameters.app_sp_id}}'
              vs_endpoint_name: '{{job.parameters.vs_endpoint_name}}'
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'

        - task_key: configure_endpoint_access
          description: 'Setup app connectivity to model serving endpoints'
          notebook_task:
            notebook_path: ../notebooks/access/setup_endpoint_access.py
            base_parameters:
              app_sp_id: '{{job.parameters.app_sp_id}}'
              serving_endpoint_name: '{{job.parameters.serving_endpoint_name}}'
              llm_endpoint_name: '{{job.parameters.llm_endpoint_name}}'

        - task_key: configure_genie_access
          description: 'Setup app connectivity to Genie Space'
          notebook_task:
            notebook_path: ../notebooks/access/setup_genie_access.py
            base_parameters:
              app_sp_id: '{{job.parameters.app_sp_id}}'
              genie_space_id: '{{job.parameters.genie_space_id}}'

      queue:
        enabled: true

    # ─────────────────────────────────────────────────────────────
    # Vector Index Job — Creates VS Delta Sync index on embedding_text
    # Prerequisite: setup_job must have run (corpus table populated)
    # ─────────────────────────────────────────────────────────────
    vector_index_job:
      name: 'bannerwise-quality-agent-vector-index'
      description: 'Creates the Delta Sync Vector Search index on certified_qa_corpus (embedding_text column)'
      tags:
        project: bannerwise-quality-agent
        purpose: vector-index-setup

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}

      tasks:
        - task_key: create_vector_search_index
          description: 'Create or sync Delta Sync VS index on certified_qa_corpus.embedding_text'
          notebook_task:
            notebook_path: ../notebooks/vs/create_vector_search_index.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'

      queue:
        enabled: true

    # ─────────────────────────────────────────────────────────────
    # Router Agent Job — Full deployment pipeline
    # smoke test → eval gate → register champion → deploy → AI Gateway
    # ─────────────────────────────────────────────────────────────
    router_agent_job:
      name: 'bannerwise-quality-agent-router'
      description: 'Deploy pipeline: smoke test → eval gate → register champion → deploy serving → configure AI Gateway'
      tags:
        project: bannerwise-quality-agent
        purpose: router-deploy-pipeline

      parameters:
        - name: prompt
          default: 'What is the total ad spend for Q1 2025?'
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: vs_endpoint
          default: ${resources.vector_search_endpoints.bannerwise_vs_endpoint.id}
        - name: vs_top_k
          default: '3'
        - name: confidence_threshold
          default: ${var.confidence_threshold}
        - name: shrink_factor
          default: ${var.shrink_factor}
        - name: judge_model
          default: ${var.judge_model}
        - name: genie_space_id
          default: ''
        - name: genie_timeout_sec
          default: '30'
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}
        - name: model_name
          default: ${var.model_name}
        - name: endpoint_name
          default: ${var.serving_endpoint_name}
        - name: workload_size
          default: Small
        - name: scale_to_zero
          default: 'true'
        - name: rate_limit_calls
          default: '100'
        - name: rate_limit_period
          default: minute

      tasks:
        - task_key: run_router_agent
          description: 'Fast-fail smoke test — validates router runs without errors'
          notebook_task:
            notebook_path: ../notebooks/agent/router_agent.py
            base_parameters:
              prompt: '{{job.parameters.prompt}}'
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              vs_endpoint: '{{job.parameters.vs_endpoint}}'
              vs_top_k: '{{job.parameters.vs_top_k}}'
              confidence_threshold: '{{job.parameters.confidence_threshold}}'
              shrink_factor: '{{job.parameters.shrink_factor}}'
              judge_model: '{{job.parameters.judge_model}}'
              genie_space_id: '{{job.parameters.genie_space_id}}'
              genie_timeout_sec: '{{job.parameters.genie_timeout_sec}}'
              sql_warehouse_id: '{{job.parameters.sql_warehouse_id}}'

        - task_key: run_eval
          description: 'Quality gate — router must pass precision/recall thresholds'
          depends_on:
            - task_key: run_router_agent
          run_job_task:
            job_id: ${resources.jobs.eval_job.id}
            job_parameters:
              regenerate_dataset: 'true'
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              vs_endpoint: '{{job.parameters.vs_endpoint}}'
              judge_model: '{{job.parameters.judge_model}}'
              confidence_threshold: '{{job.parameters.confidence_threshold}}'

        - task_key: register_model
          description: 'Register router as MLflow model (champion) — only after eval passes'
          depends_on:
            - task_key: run_eval
          notebook_task:
            notebook_path: ../notebooks/agent/register_router_model.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              model_name: '{{job.parameters.model_name}}'
              vs_endpoint: '{{job.parameters.vs_endpoint}}'
              judge_model: '{{job.parameters.judge_model}}'
              confidence_threshold: '{{job.parameters.confidence_threshold}}'

        - task_key: deploy_serving_endpoint
          description: 'Trigger Model Serving endpoint update (does not wait for warmup)'
          depends_on:
            - task_key: register_model
          notebook_task:
            notebook_path: ../notebooks/agent/deploy_serving_endpoint.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              model_name: '{{job.parameters.model_name}}'
              endpoint_name: '{{job.parameters.endpoint_name}}'
              workload_size: '{{job.parameters.workload_size}}'
              scale_to_zero: '{{job.parameters.scale_to_zero}}'

        - task_key: configure_ai_gateway
          description: 'Enable inference tables, usage tracking, and rate limits via AI Gateway'
          depends_on:
            - task_key: deploy_serving_endpoint
          notebook_task:
            notebook_path: ../notebooks/agent/configure_ai_gateway.py
            base_parameters:
              endpoint_name: '{{job.parameters.endpoint_name}}'
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              rate_limit_calls: '{{job.parameters.rate_limit_calls}}'
              rate_limit_period: '{{job.parameters.rate_limit_period}}'

      queue:
        enabled: true

    # ─────────────────────────────────────────────────────────────
    # Eval Job — Pre-deploy quality gate for the router agent
    # Generates eval dataset, runs router eval, checks thresholds
    # ─────────────────────────────────────────────────────────────
    eval_job:
      name: 'bannerwise-quality-agent-eval'
      description: 'Pre-deploy quality gate: generates eval dataset, evaluates router, asserts metric thresholds'
      tags:
        project: bannerwise-quality-agent
        purpose: evaluation

      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: schema_name
          default: ${var.schema_name}
        - name: num_paraphrases
          default: '2'
        - name: num_near_misses
          default: '2'
        - name: num_colloquial
          default: '1'
        - name: num_param_variations
          default: '1'
        - name: judge_model
          default: ${var.judge_model}
        - name: regenerate_dataset
          default: 'true'
        - name: min_precision
          default: '0.85'
        - name: min_recall
          default: '0.80'
        - name: fail_on_gate_miss
          default: 'true'
        - name: confidence_threshold
          default: ${var.confidence_threshold}
        - name: shrink_factor
          default: ${var.shrink_factor}
        - name: vs_endpoint
          default: ${resources.vector_search_endpoints.bannerwise_vs_endpoint.id}
        - name: sql_warehouse_id
          default: ${var.sql_warehouse_id}

      tasks:
        - task_key: generate_eval_dataset
          description: 'LLM-powered eval dataset generation from certified corpus'
          notebook_task:
            notebook_path: ../notebooks/eval/generate_eval_dataset.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              num_paraphrases: '{{job.parameters.num_paraphrases}}'
              num_near_misses: '{{job.parameters.num_near_misses}}'
              num_colloquial: '{{job.parameters.num_colloquial}}'
              num_param_variations: '{{job.parameters.num_param_variations}}'
              judge_model: '{{job.parameters.judge_model}}'
              regenerate_dataset: '{{job.parameters.regenerate_dataset}}'

        - task_key: run_router_eval
          description: 'Run router on every eval row, score with MLflow Evaluate'
          depends_on:
            - task_key: generate_eval_dataset
          notebook_task:
            notebook_path: ../notebooks/eval/run_router_eval_v2.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              confidence_threshold: '{{job.parameters.confidence_threshold}}'
              vs_endpoint: '{{job.parameters.vs_endpoint}}'
              judge_model: '{{job.parameters.judge_model}}'
              shrink_factor: '{{job.parameters.shrink_factor}}'
              sql_warehouse_id: '{{job.parameters.sql_warehouse_id}}'

        - task_key: check_eval_thresholds
          description: 'Assert primary metrics meet deployment gates — FAILS job if below targets'
          depends_on:
            - task_key: run_router_eval
          notebook_task:
            notebook_path: ../notebooks/eval/check_eval_thresholds.py
            base_parameters:
              catalog_name: '{{job.parameters.catalog_name}}'
              schema_name: '{{job.parameters.schema_name}}'
              min_precision: '{{job.parameters.min_precision}}'
              min_recall: '{{job.parameters.min_recall}}'
              fail_on_gate_miss: '{{job.parameters.fail_on_gate_miss}}'

      queue:
        enabled: true


