command:
  - gunicorn
  - app:app
  - --config
  - gunicorn.conf.py
  - -w
  - '4'
  - --timeout
  - '120'
  - --max-requests
  - '1000'
  - --max-requests-jitter
  - '50'
env:
  - name: 'FLASK_ENV'
    value: 'production'
  - name: 'SECRET_KEY'
    valueFrom: 'secret/bannerwise-quality-agent/flask-secret-key'
  - name: 'API_MODE'
    value: 'live'
  - name: 'SERVING_ENDPOINT_NAME'
    value: 'bannerwise-quality-router'
  - name: 'SQL_WAREHOUSE_ID'
    value: '2d8e531640ffa469'
  - name: 'CATALOG_NAME'
    value: 'aw_serverless_stable_catalog'
  - name: 'SCHEMA_NAME'
    value: 'bannerhealth'
  - name: 'LLM_ENDPOINT'
    value: 'databricks-meta-llama-3-3-70b-instruct'
