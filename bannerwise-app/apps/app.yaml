command:
  - gunicorn
  - app:app
  - --config
  - gunicorn.conf.py
  - -w
  - '4'
  - --timeout
  - '120'
  - --max-requests
  - '1000'
  - --max-requests-jitter
  - '50'
env:
  - name: 'FLASK_ENV'
    value: 'production'
  - name: 'SECRET_KEY'
    valueFrom: 'secret/bannerwise-quality-agent/flask-secret-key'
