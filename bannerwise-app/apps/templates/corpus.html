{% extends "layout.html" %}
{% block title %}Review — Bannerwise Quality Agent{% endblock %}

{% block content %}
<div class="page-corpus">
    <div class="page-header">
        <h2 class="page-title">SME Review Queue</h2>
        <div class="search-bar">
            <input type="text" id="corpusSearch" class="search-input" placeholder="Search questions..." oninput="searchCorpus()">
        </div>
    </div>

    <!-- Stats -->
    <div id="corpusStats" class="stats-bar"></div>

    <!-- Review Table -->
    <div class="table-wrapper">
        <table class="data-table" id="corpusTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Question</th>
                    <th>SQL Query</th>
                    <th>Submitted By</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="corpusTableBody">
                <!-- Populated via JS -->
            </tbody>
        </table>
    </div>

    <!-- Detail Panel (shown on row click) -->
    <div id="corpusDetail" class="detail-panel hidden"></div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => loadReviewQueue());
</script>
{% endblock %}
