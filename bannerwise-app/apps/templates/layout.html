<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bannerwise Quality Agent{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-left">
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span class="hamburger"></span>
            </button>
            <a href="/" class="header-brand">
                <img src="{{ url_for('static', filename='images/banner-health-logo.svg') }}"
                     alt="Banner Health"
                     class="brand-logo" />
                <span class="brand-divider"></span>
                <span class="brand-product">Quality Agent</span>
            </a>
        </div>
        <div class="header-right">
            <div class="header-status">
                <span class="status-indicator healthy" title="All systems healthy"></span>
                <span class="status-text">Healthy</span>
            </div>
            <div class="header-divider"></div>
            <div class="header-user">
                <div class="user-avatar">AW</div>
                <span class="user-name">arun.wagle@databricks.com</span>
            </div>
        </div>
    </header>

    <div class="app-container">
        <!-- Left Navigation -->
        <nav class="sidebar" id="sidebar">
            <ul class="nav-list">
                <li class="nav-item {% if request.path == '/ask' %}active{% endif %}">
                    <a href="/ask" class="nav-link">
                        <span class="nav-icon">&#x1F4AC;</span>
                        <span class="nav-label">Ask</span>
                    </a>
                </li>
                <li class="nav-item {% if request.path == '/history' %}active{% endif %}">
                    <a href="/history" class="nav-link">
                        <span class="nav-icon">&#x1F552;</span>
                        <span class="nav-label">History</span>
                    </a>
                </li>
                <li class="nav-item {% if request.path == '/corpus' %}active{% endif %}">
                    <a href="/corpus" class="nav-link">
                        <span class="nav-icon">&#x1F4CB;</span>
                        <span class="nav-label">Review</span>
                    </a>
                </li>
                <li class="nav-item {% if request.path == '/admin' %}active{% endif %}">
                    <a href="/admin" class="nav-link">
                        <span class="nav-icon">&#x2699;</span>
                        <span class="nav-label">Admin</span>
                    </a>
                </li>
                <li class="nav-item {% if request.path == '/demo' %}active{% endif %}">
                    <a href="/demo" class="nav-link">
                        <span class="nav-icon">&#x1F3AF;</span>
                        <span class="nav-label">Demo</span>
                    </a>
                </li>
            </ul>

            <div class="nav-footer">
                <div class="nav-footer-badge">
                    <span class="nav-icon">&#x1F6E1;</span>
                    <span class="nav-label">v0.1.0</span>
                </div>
            </div>
        </nav>

        <!-- Right Content Area -->
        <main class="content-area">
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
