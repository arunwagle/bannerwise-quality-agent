    <path d="M4 0 L20 0 L20 24 C20 28 12 34 12 34 C12 34 4 28 4 24 Z" fill="none" stroke="#002855" stroke-width="1.8"/>
    <!-- Inner banner lines (book/scroll motif) -->
    <path d="M8 6 L16 6 M8 10 L16 10 M8 14 L16 14 L14 16.5 L16 19 M8 19 L16 19" fill="none" stroke="#002855" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Bottom chevron -->
