  </g>
  <!-- "Banner Health" wordmark -->
  <text x="30" y="26" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#002855" letter-spacing="-0.5">Banner Health</text>
  <!-- Registered trademark -->
  <text x="194" y="14" font-family="Georgia, serif" font-size="7" fill="#002855">&#xAE;</text>
